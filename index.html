<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Album - A to Z Markers</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #fullscreenVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: black;
      display: none;
      z-index: 9999;
    }
  </style>
</head>

<body>

  <!-- Fullscreen Video -->
  <video 
    id="fullscreenVideo" 
    playsinline 
    webkit-playsinline 
    autoplay
  ></video>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets></a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  </a-scene>

  <script>
    const fullscreenVideo = document.getElementById("fullscreenVideo");
    const scene = document.querySelector("a-scene");

    // 🔥 A to Z letters
    const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

    function playVideo(letter) {
      fullscreenVideo.src = `./videos/${letter}.mp4`;
      fullscreenVideo.style.display = "block";
      fullscreenVideo.play().catch(() => {});
    }

    function stopVideo() {
      fullscreenVideo.pause();
      fullscreenVideo.currentTime = 0;
      fullscreenVideo.style.display = "none";
    }

    LETTERS.forEach((letter, index) => {

      const entity = document.createElement("a-entity");
      entity.setAttribute("mindar-image-target", `targetIndex: ${index}`);

      entity.addEventListener("targetFound", () => {
        playVideo(letter);
      });

      entity.addEventListener("targetLost", stopVideo);

      scene.appendChild(entity);

    });

  </script>

</body>
</html>
